<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Successful FT8 self-decode with ZynqRadio</title>
  <desc id="desc">Validation capture showing two successful CQ SV1EEX KM17 FT8 self-decodes at 12:42:00 and 12:42:30 UTC.</desc>
  <rect width="1400" height="620" fill="#0d1117"/>
  <rect x="40" y="40" width="1320" height="540" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="78" y="100" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">FT8 full-duplex validation · successful self-decode</text>
  <text x="78" y="140" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="21">ZynqRadio · direct libiio · Zynq-7000 + AD936x · WSJT-X SelfRX</text>
  <rect x="78" y="182" width="1244" height="58" rx="8" fill="#21262d"/>
  <text x="104" y="219" fill="#8b949e" font-family="Consolas,monospace" font-size="22">UTC      dB    DT    Freq        Message</text>
  <rect x="78" y="258" width="1244" height="70" rx="8" fill="#ff4b93"/>
  <text x="104" y="303" fill="#121212" font-family="Consolas,monospace" font-size="28" font-weight="700">124200    9    1.0     999   ~   CQ SV1EEX KM17</text>
  <rect x="78" y="346" width="1244" height="70" rx="8" fill="#ff4b93"/>
  <text x="104" y="391" fill="#121212" font-family="Consolas,monospace" font-size="28" font-weight="700">124230    9    0.9    1000   ~   CQ SV1EEX KM17</text>
  <circle cx="96" cy="466" r="12" fill="#3fb950"/>
  <text x="122" y="474" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Validated end-to-end: WSJT-X TX → ZynqRadio → RF → simultaneous RX → second WSJT-X decode</text>
  <text x="78" y="526" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="18">Decode values reproduced from the project validation capture made on 2026-09-02. The test dial was 1296.174 MHz.</text>
</svg>
