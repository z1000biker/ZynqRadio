<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ZynqRadio Control Center</title>
  <desc id="desc">Repository visual of the ZynqRadio full-duplex control center and validated baseline parameters.</desc>
  <rect width="1400" height="820" fill="#0d1117"/>
  <rect x="34" y="34" width="1332" height="752" rx="18" fill="#f6f6f6" stroke="#30363d" stroke-width="2"/>
  <text x="68" y="82" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">ZynqRadio Control Center v1.0.0</text>
  <rect x="68" y="108" width="150" height="52" rx="6" fill="#ffffff" stroke="#777"/>
  <text x="112" y="141" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">STOP</text>
  <text x="280" y="126" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="14">STATE</text>
  <text x="280" y="150" fill="#178a20" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">RUNNING</text>
  <text x="466" y="126" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="14">PTT</text>
  <text x="466" y="150" fill="#178a20" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">RX</text>
  <text x="640" y="126" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="14">CAT</text>
  <text x="640" y="150" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">CONNECTED</text>
  <text x="840" y="126" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="14">DIAL</text>
  <text x="840" y="150" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">1296.174000 MHz</text>
  <rect x="68" y="194" width="610" height="502" rx="10" fill="#fff" stroke="#ccc"/>
  <rect x="700" y="194" width="620" height="502" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="94" y="232" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Radio / RX</text>
  <text x="726" y="232" fill="#111" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">TX / Full duplex</text>
  <g font-family="Consolas,monospace" font-size="18" fill="#222">
    <text x="94" y="282">IIO URI                  ip:pluto.local</text>
    <text x="94" y="326">Dial frequency           1,296,174,000 Hz</text>
    <text x="94" y="370">IIO sample rate          2,100,000 S/s</text>
    <text x="94" y="414">RF bandwidth             700,000 Hz</text>
    <text x="94" y="458">RX gain                  40 dB</text>
    <text x="94" y="502">DSP audio gain           20x</text>
    <text x="94" y="546">RX LO offset             10,000 Hz</text>
    <text x="94" y="590">RX buffer                32,768 complex</text>
    <text x="94" y="634">I-only RX transport      ON</text>
    <text x="726" y="282">TX hardware gain         -30 dB</text>
    <text x="726" y="326">TX digital level         0.100</text>
    <text x="726" y="370">RX gain during TX        20 dB</text>
    <text x="726" y="414">TX buffer                131,072 complex</text>
    <text x="726" y="458">TX Q polarity            +1</text>
    <text x="726" y="502">TX audio path            enabled</text>
    <text x="726" y="546">RF transmission          GUI controlled</text>
  </g>
  <rect x="94" y="650" width="24" height="24" rx="4" fill="#3fb950"/>
  <text x="130" y="669" fill="#222" font-family="Segoe UI,Arial,sans-serif" font-size="19">Low-bandwidth RX transport enabled for stable full-duplex streaming</text>
  <text x="68" y="744" fill="#555" font-family="Segoe UI,Arial,sans-serif" font-size="17">Validated baseline configuration. Frequency and gain values shown are development/test settings, not universal RF recommendations.</text>
</svg>
