name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\src\ZynqRadio\ZynqRadio.csproj
      - name: Build
        run: dotnet build .\src\ZynqRadio\ZynqRadio.csproj -c Release --no-restore
